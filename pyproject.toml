[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wowstats"
version = "0.1.0"
description = "WoW Forever character statistics (unofficial Blizzard API client, no dependencies)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
wowstats = "wowstats.__main__:main"

[tool.setuptools]
packages = ["wowstats"]
